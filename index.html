<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Planck Racer - Tri-Mode Edition</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚙</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <canvas id="game-canvas"></canvas>
    </main>

    <div id="hud">
        <div class="hud-item">Speed: <span id="speed-value">0</span> km/h</div>
        <div class="hud-item">Fuel: <span id="fuel-value">100</span>%</div>
        <div class="hud-item">Distance: <span id="distance-value">0</span> m</div>
        <div class="hud-item">Time: <span id="time-display">12:00</span></div>
    </div>

    <!-- Help Panel -->
    <div id="help-panel" class="overlay-panel hidden">
        <h2>🚙 Planck Racer</h2>
        <h3>🎮 Controls</h3>
        <table>
            <thead><tr><th>Action</th><th>Keyboard</th><th>Mobile</th></tr></thead>
            <tbody>
                <tr><td>Throttle</td><td>↑</td><td><b>Gas</b></td></tr>
                <tr><td>Brake</td><td>↓</td><td><b>Brake</b></td></tr>
                <tr><td>Pitch (Air)</td><td>← / →</td><td>◄ / ►</td></tr>
                <tr><td>Reset</td><td>R</td><td>—</td></tr>
                <tr><td>Debug</td><td>D</td><td>—</td></tr>
            </tbody>
        </table>
        <button id="close-help-btn">Close</button>
    </div>

    <!-- Options Panel -->
    <div id="options-panel" class="overlay-panel hidden">
        <h2>⚙️ Options</h2>
        
        <div class="option-group">
            <label for="graphics-select">Graphics Mode</label>
            <select id="graphics-select">
                <option value="modern">Modern (Day/Night, Dynamic Lights)</option>
                <option value="classic">Classic (Static Light, Shadows)</option>
                <option value="basic">Basic (Flat, No Shadows)</option>
            </select>
        </div>

        <div class="option-group">
            <label for="zoom-slider">Camera Distance</label>
            <input type="range" id="zoom-slider" min="15" max="60" value="28" step="0.5">
            <div class="slider-value"><span id="zoom-display">28</span></div>
        </div>
        
        <button id="close-options-btn">Close</button>
    </div>
    
    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div class="mobile-left">
            <button id="tilt-backward-btn" class="mobile-btn">◄</button>
            <button id="tilt-forward-btn" class="mobile-btn">►</button>
        </div>
        <div class="mobile-right">
            <button id="brake-btn" class="mobile-btn">Brake</button>
            <button id="throttle-btn" class="mobile-btn">Gas</button>
        </div>
    </div>

    <!-- Game Over Panel -->
    <div id="game-over-panel" class="overlay-panel hidden">
        <h2>GAME OVER</h2>
        <p>Out of fuel!</p>
        <button id="restart-btn">Restart</button>
    </div>

    <div id="bottom-ui-bar">
        <button id="help-toggle-button">Help (H)</button>
        <button id="options-toggle-button">Options (O)</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/planck@latest/dist/planck.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
